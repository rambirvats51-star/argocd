
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ram-axion-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ram-axion-ui
  template:
    metadata:
      labels:
        app: ram-axion-ui
    spec:
      containers:
        - name: ram-axion-ui
          image: rambirvats51/ram-axion-ui:latest
          ports:
            - containerPort: 80
